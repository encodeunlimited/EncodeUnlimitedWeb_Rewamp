<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Encode Unlimited Software Engineering Horana</title>
  <meta name="description"
    content="Contact Encode Unlimited in Horana, Sri Lanka for custom software development, ERP, and POS solutions. Get a practical execution plan for your next project." />
  <meta name="keywords"
    content="contact encode unlimited, software development horana, IT company sri lanka, software engineering contact" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://encodeunlimited.com/contact.html" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact Encode Unlimited",
    "description": "Reach out to Encode Unlimited for software engineering consultations and project inquiries.",
    "url": "https://encodeunlimited.com/contact.html",
    "mainEntity": {
      "@type": "LocalBusiness",
      "name": "Encode Unlimited",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Kubuka, Colombo Rd",
        "addressLocality": "Horana",
        "addressCountry": "LK"
      },
      "email": "info@encodeunlimited.com",
      "telephone": "+94 70 62 91 709"
    }
  }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-mark.svg">
</head>

<body data-page="contact" class="text-slate-100 antialiased">
  <div id="site-nav"></div>
  <main>
    <section class="page-hero">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold text-white" data-aos="fade-up">Contact Us</h1>
        <p class="mt-4 max-w-3xl text-slate-300" data-aos="fade-up" data-aos-delay="120">Tell us about your project and
          we will respond with a practical execution plan.</p>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-4 pb-8 sm:px-6 lg:px-8" data-aos="fade-up">
      <div class="media-frame h-52 md:h-64 rounded-2xl overflow-hidden"><img src="assets/images/web-office.png"
          alt="Encode Unlimited office and contact visual" class="object-cover w-full h-full" /></div>
    </section>

    <section class="mx-auto grid max-w-7xl gap-6 px-4 pb-16 sm:px-6 lg:grid-cols-2 lg:px-8">
      <article class="card" data-aos="fade-up">
        <h2 class="text-xl font-semibold text-white">Send a Message</h2>
        <form id="contact-form" class="mt-5 space-y-4" novalidate>
          <div><label class="mb-1 block text-sm text-slate-300" for="name">Name</label><input id="name" name="name"
              required
              class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-3 text-slate-100 outline-none focus:border-[#7edc05]"
              type="text" /></div>
          <div><label class="mb-1 block text-sm text-slate-300" for="email">Email</label><input id="email" name="email"
              required
              class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-3 text-slate-100 outline-none focus:border-[#7edc05]"
              type="email" /></div>
          <div><label class="mb-1 block text-sm text-slate-300" for="company">Company</label><input id="company"
              name="company"
              class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-3 text-slate-100 outline-none focus:border-[#7edc05]"
              type="text" /></div>
          <div><label class="mb-1 block text-sm text-slate-300" for="message">Message</label><textarea id="message"
              name="message" rows="4" required
              class="w-full rounded-lg border border-slate-700 bg-slate-900/80 px-4 py-3 text-slate-100 outline-none focus:border-[#7edc05]"></textarea>
          </div>
          <button type="submit" class="btn-primary w-full">Submit Inquiry</button>
          <p id="form-result" aria-live="polite" class="mt-4 text-sm"></p>
        </form>
      </article>

      <article class="card" data-aos="fade-up" data-aos-delay="100">
        <h2 class="text-xl font-semibold text-white">Contact Information</h2>
        <div class="mt-6 space-y-5">
          <div class="flex items-start gap-4">
            <span class="p-2 bg-slate-800 rounded-lg"><i data-lucide="map-pin"
                class="w-5 h-5 text-[#7edc05]"></i></span>
            <div>
              <p class="text-xs uppercase tracking-wider text-slate-500 font-bold">Location</p>
              <p class="text-slate-200 mt-1">Kubuka, Colombo Rd, Horana</p>
            </div>
          </div>
          <div class="flex items-start gap-4">
            <span class="p-2 bg-slate-800 rounded-lg"><i data-lucide="phone" class="w-5 h-5 text-[#7edc05]"></i></span>
            <div>
              <p class="text-xs uppercase tracking-wider text-slate-500 font-bold">Phone</p>
              <p class="text-slate-200 mt-1">+94 70 62 91 709</p>
              <p class="text-slate-200">+94 77 22 91 709</p>
            </div>
          </div>
          <div class="flex items-start gap-4">
            <span class="p-2 bg-slate-800 rounded-lg"><i data-lucide="mail" class="w-5 h-5 text-[#7edc05]"></i></span>
            <div>
              <p class="text-xs uppercase tracking-wider text-slate-500 font-bold">Email</p>
              <p class="text-slate-200 mt-1">info@encodeunlimited.com</p>
            </div>
          </div>
          <div class="flex items-start gap-4">
            <span class="p-2 bg-slate-800 rounded-lg"><i data-lucide="globe" class="w-5 h-5 text-[#7edc05]"></i></span>
            <div>
              <p class="text-xs uppercase tracking-wider text-slate-500 font-bold">Website</p>
              <p class="text-slate-200 mt-1">www.encodeunlimited.com</p>
            </div>
          </div>
        </div>

        <div class="mt-8 overflow-hidden rounded-2xl border border-slate-700 bg-slate-900 group">
          <a href="https://www.google.com/maps/place/P2P8%2BJ6,+Horana/@6.7365625,80.0155625,17z/" target="_blank"
            class="block relative">
            <iframe title="Encode Unlimited location map"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3962.61066738988!2d80.0133738!3d6.7365625!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ae24b475a084f91%3A0x467afb6d03a75bac!2sP2P8%2BJ6%2C%20Horana!5e0!3m2!1sen!2slk!4v1710086400000!5m2!1sen!2slk"
              width="100%" height="280" style="border:0;"
              allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <div
              class="absolute inset-0 bg-slate-950/20 group-hover:bg-transparent transition-colors duration-300 flex items-center justify-center">
              <span
                class="bg-slate-900/90 text-white text-xs px-3 py-2 rounded-lg border border-slate-700 opacity-0 group-hover:opacity-100 transition-opacity">View
                on Google Maps</span>
            </div>
          </a>
        </div>
      </article>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
